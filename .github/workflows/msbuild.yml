name: Build Client176 DLL

on:
  workflow_dispatch:  # 让你可以手动点击运行

env:
  SOLUTION_FILE_PATH: .  # 项目根目录下有 .sln 文件

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages (如果有)
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Build the solution (Release x86)
      run: |
        msbuild /m /p:Configuration=Release /p:Platform=x86 /p:OutDir=./output/ ${{ env.SOLUTION_FILE_PATH }}

    - name: Upload the generated DLL as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ijl15.dll
        path: ./output/ijl15.dll
